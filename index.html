<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réinitialisation du mot de passe</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        --cream: #f7f1e1;
        --ink: #1a1a1a;
        --flag-blue: #00a3e0;
        --danger-red: #c0392b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--cream);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        color: var(--ink);
        padding: 24px;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 32px 28px;
        max-width: 380px;
        width: 100%;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p.subtitle {
        font-size: 14px;
        color: #666;
        line-height: 1.4;
        margin: 0 0 24px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        margin-bottom: 16px;
        background: #f8f9fa;
      }
      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: var(--flag-blue);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .message {
        font-size: 14px;
        line-height: 1.4;
        margin-top: 16px;
        text-align: center;
      }
      .message.error {
        color: var(--danger-red);
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="loadingState">
        <h1 data-i18n="verifying_title"></h1>
        <p class="subtitle" data-i18n="verifying_sub"></p>
      </div>

      <div id="invalidState" class="hidden">
        <h1 data-i18n="invalid_title"></h1>
        <p class="subtitle" data-i18n="invalid_body"></p>
      </div>

      <div id="formState" class="hidden">
        <h1 data-i18n="form_title"></h1>
        <p class="subtitle" data-i18n="form_sub"></p>

        <form id="resetForm">
          <label for="password" data-i18n="new_password"></label>
          <input
            type="password"
            id="password"
            minlength="6"
            required
            autocomplete="new-password"
          />

          <label for="confirmPassword" data-i18n="confirm_password"></label>
          <input
            type="password"
            id="confirmPassword"
            minlength="6"
            required
            autocomplete="new-password"
          />

          <button type="submit" id="submitBtn" data-i18n="submit"></button>
        </form>
        <div id="formMessage" class="message hidden"></div>
      </div>

      <div id="doneState" class="hidden">
        <h1 data-i18n="done_title"></h1>
        <p class="subtitle" data-i18n="done_body"></p>
      </div>
    </div>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const SUPABASE_URL = "https://pqbibipzkybzzvlwtych.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_jE1KcImOqxVo7aRAGLVTvg_fnFafQb6";

      const TRANSLATIONS = {
        en: {
          page_title: "Password reset",
          verifying_title: "Verifying link…",
          verifying_sub: "Please wait a moment.",
          invalid_title: "Link expired or invalid",
          invalid_body:
            "This password reset link is no longer valid. Please request a new one from the app.",
          form_title: "Set a new password",
          form_sub: "Choose a new password for your account.",
          new_password: "New password",
          confirm_password: "Confirm new password",
          submit: "Update password",
          updating: "Updating…",
          too_short: "Password must be at least 6 characters.",
          mismatch: "Passwords do not match.",
          generic_error: "Something went wrong. Please try again.",
          done_title: "Password updated",
          done_body:
            "Your password has been changed. You can now go back to the app and sign in.",
        },
        fr: {
          page_title: "Réinitialisation du mot de passe",
          verifying_title: "Vérification du lien…",
          verifying_sub: "Veuillez patienter un instant.",
          invalid_title: "Lien expiré ou invalide",
          invalid_body:
            "Ce lien de réinitialisation n'est plus valide. Veuillez en demander un nouveau depuis l'application.",
          form_title: "Définir un nouveau mot de passe",
          form_sub: "Choisissez un nouveau mot de passe pour votre compte.",
          new_password: "Nouveau mot de passe",
          confirm_password: "Confirmez le nouveau mot de passe",
          submit: "Mettre à jour le mot de passe",
          updating: "Mise à jour…",
          too_short: "Le mot de passe doit contenir au moins 6 caractères.",
          mismatch: "Les mots de passe ne correspondent pas.",
          generic_error: "Une erreur est survenue. Veuillez réessayer.",
          done_title: "Mot de passe mis à jour",
          done_body:
            "Votre mot de passe a été modifié. Vous pouvez maintenant retourner dans l'application et vous connecter.",
        },
        de: {
          page_title: "Passwort zurücksetzen",
          verifying_title: "Link wird überprüft…",
          verifying_sub: "Bitte einen Moment warten.",
          invalid_title: "Link abgelaufen oder ungültig",
          invalid_body:
            "Dieser Link zum Zurücksetzen des Passworts ist nicht mehr gültig. Bitte fordere in der App einen neuen an.",
          form_title: "Neues Passwort festlegen",
          form_sub: "Wähle ein neues Passwort für dein Konto.",
          new_password: "Neues Passwort",
          confirm_password: "Neues Passwort bestätigen",
          submit: "Passwort aktualisieren",
          updating: "Wird aktualisiert…",
          too_short: "Das Passwort muss mindestens 6 Zeichen lang sein.",
          mismatch: "Die Passwörter stimmen nicht überein.",
          generic_error: "Etwas ist schiefgelaufen. Bitte versuche es erneut.",
          done_title: "Passwort aktualisiert",
          done_body:
            "Dein Passwort wurde geändert. Du kannst jetzt zur App zurückkehren und dich anmelden.",
        },
        lb: {
          page_title: "Passwuert zerécksetzen",
          verifying_title: "Link gëtt iwwerpréift…",
          verifying_sub: "Waart w.e.g. e Moment.",
          invalid_title: "Link ofgelaf oder ongëlteg",
          invalid_body:
            "Dësen Link fir d'Passwuert zréckzesetzen ass net méi gëlteg. Frot w.e.g. an der App en neien un.",
          form_title: "Neit Passwuert festleeën",
          form_sub: "Wielt en neit Passwuert fir Äert Konto.",
          new_password: "Neit Passwuert",
          confirm_password: "Neit Passwuert confirméieren",
          submit: "Passwuert aktualiséieren",
          updating: "Gëtt aktualiséiert…",
          too_short: "D'Passwuert muss mindestens 6 Zeechen hunn.",
          mismatch: "D'Passwierder stëmmen net iwwereneen.",
          generic_error:
            "Et ass eppes schifgaangen. Probéiert w.e.g. nach eng Kéier.",
          done_title: "Passwuert aktualiséiert",
          done_body:
            "Äert Passwuert gouf geännert. Dir kënnt elo zréck an d'App goen an iech umellen.",
        },
      };

      function resolveLanguage() {
        const fromLink = new URLSearchParams(window.location.search).get(
          "lang",
        );

        if (fromLink && TRANSLATIONS[fromLink]) {
          return fromLink;
        }

        const fromBrowser = (navigator.language || "").split("-")[0];

        if (TRANSLATIONS[fromBrowser]) {
          return fromBrowser;
        }

        return "fr";
      }

      const lang = resolveLanguage();
      const strings = TRANSLATIONS[lang];

      document.documentElement.lang = lang;

      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = strings[el.dataset.i18n];
      });

      document.title = strings.page_title;

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const loadingState = document.getElementById("loadingState");
      const invalidState = document.getElementById("invalidState");
      const formState = document.getElementById("formState");
      const doneState = document.getElementById("doneState");
      const form = document.getElementById("resetForm");
      const submitBtn = document.getElementById("submitBtn");
      const formMessage = document.getElementById("formMessage");

      function showOnly(el) {
        [loadingState, invalidState, formState, doneState].forEach((s) => {
          s.classList.add("hidden");
        });

        el.classList.remove("hidden");
      }

      function showFormError(text) {
        formMessage.textContent = text;
        formMessage.className = "message error";
      }

      async function verifyRecoveryToken() {
        const params = new URLSearchParams(window.location.search);

        const tokenHash = params.get("token_hash");
        const type = params.get("type");

        if (!tokenHash || type !== "recovery") {
          showOnly(invalidState);
          return;
        }

        const { error } = await supabase.auth.verifyOtp({
          token_hash: tokenHash,
          type: "recovery",
        });

        if (error) {
          console.warn("Recovery verification failed:", error.message);
          showOnly(invalidState);
          return;
        }

        window.history.replaceState(
          {},
          document.title,
          `/?lang=${encodeURIComponent(lang)}`,
        );

        showOnly(formState);
      }

      verifyRecoveryToken();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        formMessage.classList.add("hidden");

        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password.length < 6) {
          return showFormError(strings.too_short);
        }

        if (password !== confirmPassword) {
          return showFormError(strings.mismatch);
        }

        submitBtn.disabled = true;
        submitBtn.textContent = strings.updating;

        const { error } = await supabase.auth.updateUser({
          password,
        });

        if (error) {
          console.warn("updateUser failed:", error.message);
          showFormError(strings.generic_error);
          submitBtn.disabled = false;
          submitBtn.textContent = strings.submit;
          return;
        }

        showOnly(doneState);
      });
    </script>
  </body>
</html>
