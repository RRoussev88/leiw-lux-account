<section class="card narrow">
  <div id="loadingState">
    <h1 tabindex="-1">{{t:password.verifying_title}}</h1>
    <p class="subtitle">{{t:password.verifying_sub}}</p>
  </div>

  <div id="invalidState" hidden>
    <h1 tabindex="-1">{{t:password.invalid_title}}</h1>
    <p class="subtitle">{{t:password.invalid_body}}</p>
  </div>

  <div id="formState" hidden>
    <h1 tabindex="-1">{{t:password.form_title}}</h1>
    <p class="subtitle">{{t:password.form_sub}}</p>
    <form id="resetForm" novalidate>
      <label for="password">{{t:password.new_password}}</label>
      <input type="password" id="password" name="password" minlength="6" required autocomplete="new-password">

      <label for="confirmPassword">{{t:password.confirm_password}}</label>
      <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" required autocomplete="new-password">

      <button type="submit" id="submitBtn" class="btn">{{t:password.submit}}</button>
    </form>
    <p id="formMessage" class="message error" role="alert" hidden></p>
  </div>

  <div id="doneState" hidden>
    <h1 tabindex="-1">{{t:password.done_title}}</h1>
    <p class="subtitle">{{t:password.done_body}}</p>
  </div>

  <noscript><p class="message error">{{t:password.noscript}}</p></noscript>
</section>
<script type="application/json" id="page-data">{{page_data}}</script>
