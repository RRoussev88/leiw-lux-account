<section class="hero">
  <div class="hero-text">
    <h1 class="hero-title">{{t:site.name}}</h1>
    <p class="hero-tagline">{{t:home.tagline}}</p>
    <p class="hero-lead">{{t:home.lead}}</p>
  </div>
  <img class="hero-mascot"
       src="/assets/img/mascot-wave@2x.png"
       srcset="/assets/img/mascot-wave.png 179w, /assets/img/mascot-wave@2x.png 358w"
       sizes="(min-width: 760px) 280px, 200px"
       width="358" height="544" alt="{{t:home.mascot_alt}}">
</section>
